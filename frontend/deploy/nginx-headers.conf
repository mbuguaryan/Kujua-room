# nginx equivalent of public/_headers. Include inside the server block that
# serves dist/. Kept in sync with public/_headers by hand — if you change one,
# change the other.

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.cloudflare.com https: wss:; media-src 'self' blob:; worker-src 'self' blob:; upgrade-insecure-requests" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# SPA fallback: React Router owns /r/:slug, /host, /host/login.
location / {
  try_files $uri $uri/ /index.html;
}
